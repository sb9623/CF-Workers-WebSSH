# Keep this fork in sync with the upstream repository.
# Runs weekly and can also be triggered manually from the Actions tab.
# If upstream changes conflict with local patches, the job fails loudly
# so the conflict can be resolved by hand instead of silently breaking.

name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * 0' # every Sunday 03:00 UTC (11:00 Beijing)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Merge upstream into this fork
        run: |
          http_code=$(curl -s -o /tmp/merge.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/merge-upstream" \
            -d '{"branch":"main"}')
          cat /tmp/merge.json
          echo "HTTP status: $http_code"
          if [ "$http_code" = "409" ]; then
            echo "::error::Upstream sync hit a merge conflict. Resolve it manually, then re-run."
            exit 1
          fi
          if [ "$http_code" != "200" ]; then
            echo "::error::Upstream sync failed with HTTP $http_code."
            exit 1
          fi
          echo "Sync finished (or already up to date)."
